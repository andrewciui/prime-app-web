<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a phone-width app column for Crew and Client, a wide board for Office. One fixed light look: near-white ground, fir green and lime only as accents. */
:root {
  --page: #FAFAF8; --surface: #FFFFFF; --ink: #141613; --muted: #60655D; --line: #E8E9E4; --soft: #F0F1EC;
  --seg: #EAEBE6; --control: #D3D6CE; --edge: #DCDED7;
  --brand: #0C1F01; --brand-ink: #FFFFFF; --link: #2F5A0E; --focus: #2F5A0E;
  --ok: #E6F1D3; --ok-ink: #355010; --warn: #FFF3D1; --warn-ink: #5C4300; --stop: #FCE7E2; --stop-ink: #7A2614;
  --canary: #CBFF55; --on-canary: #0C1F01; --on-grad: #FFFFFF; --on-grad-muted: #D3DEC6;
  --ph-a: #ECE8DE; --ph-b: #D8D1C1; --ph-ink: #4E4636;
  --switch-on: #0C1F01; --bar-fill: linear-gradient(90deg, #0C1F01, #3E7A14);
  --shadow: 0 1px 2px rgba(20,22,19,0.05), 0 8px 24px rgba(20,22,19,0.06);
  --shadow-sm: 0 1px 3px rgba(20,22,19,0.14);
  --glass: rgba(250,250,248,0.92); --scrim: rgba(10,12,9,0.45); --grad-edge: transparent;
  --grad: radial-gradient(130% 100% at 100% 0%, rgba(203,255,85,0.30) 0%, rgba(203,255,85,0) 50%), linear-gradient(155deg, #0C1F01 0%, #163509 52%, #2D5A10 100%);
  color-scheme: light;
  --font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { overflow-x: clip; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); }
a { color: var(--link); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
p { margin: 0; }
b, strong { font-weight: 600; }

.wrap { max-width: 460px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 116px; }
.wrap.wide { max-width: 1120px; padding-block: 0 48px; }
.wrap.bare { padding-block: 18px 32px; }
.view { display: flex; flex-direction: column; gap: 16px; animation: rise 0.18s ease-out; }
@keyframes rise { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.stack { display: flex; flex-direction: column; gap: 10px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.grow { flex-grow: 1; }
.sub { font-size: 14px; color: var(--muted); }
.sm { font-size: 13px; }
.xs { font-size: 12px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }

.card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }
.list { display: flex; flex-direction: column; overflow: hidden; }
.pad { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; }
.row.mid { align-items: center; }
.divider { height: 1px; background: var(--line); margin-left: 70px; }
.line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.tile { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; font-size: 19px; }
.tile.sm { width: 36px; height: 36px; border-radius: 10px; font-size: 17px; }
.tile.warn { background: var(--warn); }
.tile.stop { background: var(--stop); }
.lbl { font-size: 12px; font-weight: 500; color: var(--muted); }
.val { font-size: 15px; line-height: 1.4; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok); color: var(--ok-ink); }
.chip.warn { background: var(--warn); color: var(--warn-ink); }
.chip.stop { background: var(--stop); color: var(--stop-ink); }
.chip.canary { background: var(--canary); color: var(--on-canary); }
.chip.caps { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
.chip.ghost { background: rgba(255,255,255,0.13); color: var(--on-grad); }
/* Job status: one fixed colour per status, the same on cards, chips and the job sheet. Amber is reserved for site alerts and rain days. */
:root { --st-planned: #E8E9E4; --st-planned-ink: #4D524A; --st-sent: #DCEAF8; --st-sent-ink: #1D4F80; --st-confirmed: #E9E2F8; --st-confirmed-ink: #4B2E8C; --st-onsite: #E6F1D3; --st-onsite-ink: #355010; --st-done: #DDE3DA; --st-done-ink: #1F2A1A; --st-rain: #FFE7C7; --st-rain-ink: #7A4600; --alert: #FFF1CC; --alert-ink: #5C4300; }
.chip.st-planned { background: var(--st-planned); color: var(--st-planned-ink); } .chip.st-sent { background: var(--st-sent); color: var(--st-sent-ink); } .chip.st-confirmed { background: var(--st-confirmed); color: var(--st-confirmed-ink); }
.chip.st-onsite { background: var(--st-onsite); color: var(--st-onsite-ink); } .chip.st-done { background: var(--st-done); color: var(--st-done-ink); } .chip.st-rain { background: var(--st-rain); color: var(--st-rain-ink); }

.card.job { position: relative; }

.card.job[data-st="sent"]::before { background: var(--st-sent-ink); } .card.job[data-st="confirmed"]::before { background: var(--st-confirmed-ink); } .card.job[data-st="onsite"]::before { background: #3E9B2F; }
.card.job[data-st="done"]::before { background: var(--st-done-ink); } .card.job[data-st="rain"]::before { background: var(--st-rain-ink); }

.fchip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.fchip i { width: 8px; height: 8px; border-radius: 999px; background: var(--control); } .fchip .n { color: var(--muted); font-weight: 500; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); } .fchip[aria-pressed="true"] .n { color: var(--page); opacity: 0.8; }
.fchip[data-st="sent"] i { background: var(--st-sent-ink); } .fchip[data-st="confirmed"] i { background: var(--st-confirmed-ink); } .fchip[data-st="onsite"] i { background: #3E9B2F; } .fchip[data-st="done"] i { background: var(--st-done-ink); } .fchip[data-st="rain"] i { background: var(--st-rain-ink); }
.chip.alert { background: var(--alert); color: var(--alert-ink); white-space: normal; text-align: left; line-height: 1.25; }
.chip.alert.rm { cursor: pointer; border: 0; } .alerts { gap: 6px; }
.blockcard { background: var(--st-rain); color: var(--st-rain-ink); } .blockcard .tile { background: rgba(255,255,255,0.6); } .blockcard .sub { color: inherit; opacity: 0.85; }
.sk { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--soft) 25%, #E3E5DF 50%, var(--soft) 75%); background-size: 200% 100%; animation: skel 1.3s linear infinite; }

.toast.act { pointer-events: auto; display: flex; align-items: center; gap: 16px; }
.tundo { border: 0; background: transparent; color: var(--canary); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 0; }

.hero { background: var(--grad); color: var(--on-grad); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 0 0 1px var(--grad-edge); }

.bignum { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.09); min-width: 0; }
.stat span { font-size: 12px; color: var(--on-grad-muted); }
.stat b { font-size: 17px; font-weight: 700; }
.bar { display: block; height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }

.btn { min-height: 48px; border-radius: 999px; border: 0; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 0 20px; text-align: center; transition: transform 0.08s; }

.btn-canary { background: var(--canary); color: var(--on-canary); }

.btn-text { background: transparent; color: var(--link); padding: 0 8px; }
.btn-sm { min-height: 38px; font-size: 14px; padding: 0 14px; }

.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }

.iconbtn { position: relative; width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--surface); box-shadow: var(--shadow-sm); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
.iconbtn .dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 999px; background: #E5484D; box-shadow: 0 0 0 2px var(--surface); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--seg); border-radius: 999px; }
.seg button { min-height: 40px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; padding: 0 10px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-sm); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--control); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); }
.tabs button { min-height: 44px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-size: 15px; font-weight: 500; cursor: pointer; }
.tabs button[aria-pressed="true"] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 700; }

.days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.days button { border: 0; background: var(--surface); box-shadow: var(--shadow-sm); border-radius: 16px; padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--ink); }
.days button span { font-size: 11px; color: var(--muted); font-weight: 600; }
.days button b { font-size: 18px; font-weight: 700; }
.days button i { width: 5px; height: 5px; border-radius: 999px; background: transparent; }
.days button i.on { background: var(--muted); }
.days button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.days button[aria-pressed="true"] span { color: var(--page); opacity: 0.75; }
.days button[aria-pressed="true"] i.on { background: var(--canary); }

.hello { display: flex; align-items: center; gap: 12px; }
.hello .name { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.avatar { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 999px; border: 0; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: var(--on-grad); background: var(--grad); cursor: pointer; }
.av { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 999px; border: 2px solid var(--surface); background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.av + .av { margin-left: -8px; }
.avs { display: inline-flex; }

.tool { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.tool:last-child { border-bottom: 0; }
.tool input { flex: 0 0 auto; width: 22px; height: 22px; margin: 0; accent-color: var(--switch-on); }
.tool.done .tname { text-decoration: line-through; color: var(--muted); }
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--ok); color: var(--ok-ink); font-size: 14px; }
.callout.warn { background: var(--warn); color: var(--warn-ink); }
/* paint orders */
.porder { align-items: flex-start; } .porder .ptxt { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0; }
.porder .pbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; } .porder .btn { min-height: 36px; }
.porder.ready { flex-direction: column; align-items: stretch; } .porder.ready .phead { display: flex; gap: 10px; align-items: flex-start; }
/* the order that is live right now, pinned to the top of every screen */
.premind .btn { align-self: flex-start; }
.premind.inl { display: flex; flex-direction: column; gap: 8px; padding: 4px 16px 14px 46px; }
.offbar { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-bottom: 12px; border-radius: 14px; background: var(--soft); color: var(--ink); font-size: 13px; border: 1px solid var(--line); }
.obar .offbar { max-width: 1120px; margin: 0 auto 10px; }
.stat.wet b { color: #FFD27A; }
.wxwet { color: var(--warn-ink); font-weight: 600; }
.lbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 19; display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 12px; border-radius: 18px; background: var(--warn); color: var(--warn-ink); box-shadow: var(--shadow-sm); }
.lbar.ok { background: var(--grad); color: var(--on-grad); box-shadow: 0 0 0 1px rgba(203,255,85,0.35), var(--shadow); }
.lbar .lb-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 2px 4px; text-align: left; cursor: pointer; color: inherit; }
.lbar .lb-ic { width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,0.6); }
.lbar.ok .lb-ic { background: var(--canary); }
.lbar .lb-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.lbar .lb-t b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbar .lb-t span { font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbar .lb-more { flex: none; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(0,0,0,0.12); }
.lbar.ok .lb-more { background: rgba(255,255,255,0.18); }
.lbar .lb-go { flex: none; display: inline-flex; align-items: center; min-height: 38px; padding: 0 12px; border: 0; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; background: var(--brand); color: var(--brand-ink); white-space: nowrap; }
.lbar.ok .lb-go { background: var(--canary); color: var(--on-canary); }
.lbar .lb-pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; animation: lbp 1.6s ease-in-out infinite; }
@keyframes lbp { 50% { opacity: 0.2; } }
@media (prefers-reduced-motion: reduce) { .lbar .lb-pulse { animation: none; } }
.obar .lbar { position: static; max-width: 1120px; margin: 0 auto 10px; }
/* lock screen preview (prototype) */
.lock { border-radius: 28px; padding: 14px 12px 18px; background: linear-gradient(170deg, #1E3311 0%, #0C1F01 55%, #050C01 100%); color: #FFFFFF; display: flex; flex-direction: column; gap: 10px; }
.lock .isl { align-self: center; display: flex; align-items: center; gap: 10px; min-width: 170px; max-width: 100%; padding: 6px 12px; border-radius: 999px; background: #000000; font-size: 12px; font-weight: 600; }
.lock .isl .r { margin-left: auto; color: var(--canary); }
.lock .clock { text-align: center; font-size: 54px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; margin-top: 6px; }
.lock .ldate { text-align: center; font-size: 14px; opacity: 0.8; margin-top: -4px; }
.lock .la { border-radius: 20px; padding: 12px; background: rgba(20,22,19,0.72); display: flex; flex-direction: column; gap: 8px; }
.lock .la-top { display: flex; align-items: center; gap: 10px; }
.lock .la-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--canary); font-size: 19px; flex: none; }
.lock .la-t { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; } .lock .la-t b { font-size: 15px; } .lock .la-t span { font-size: 12px; opacity: 0.75; }
.lock .la-go { padding: 7px 11px; border-radius: 999px; background: var(--canary); color: var(--on-canary); font-size: 12px; font-weight: 700; flex: none; }
.lock .la-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.lock .la-steps i { height: 5px; border-radius: 999px; background: rgba(255,255,255,0.22); } .lock .la-steps i.on { background: var(--canary); }
.lock .la-lbl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px; opacity: 0.75; }
.lock .ntf { border-radius: 18px; padding: 10px 12px; background: rgba(255,255,255,0.16); display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.lock .ntf .app { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.75; letter-spacing: 0.02em; }
.droid { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.droid .sbar { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; background: #111311; color: #FFFFFF; }
.droid .sbar .sic { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; background: #FFFFFF; color: #111311; }
.droid .drow { display: flex; gap: 10px; padding: 12px 14px; align-items: flex-start; }
.droid .drow .col b { font-size: 14px; } .droid .dbtns { display: flex; gap: 16px; padding: 0 14px 12px 50px; font-size: 13px; font-weight: 700; color: var(--link); }
.pqty { display: flex; align-items: center; gap: 12px; padding: 10px 14px; } .pqty + .pqty { border-top: 1px solid var(--line); }
.pqty .col { flex-grow: 1; min-width: 0; } .pqty.off { opacity: 0.45; }
.pitem { display: flex; gap: 12px; align-items: center; padding: 10px 14px; } .pitem + .pitem { border-top: 1px solid var(--line); }
.pitem .q { font-weight: 800; font-size: 18px; min-width: 34px; text-align: right; }
.pstore { display: flex; flex-direction: column; gap: 6px; } .pstore .btnrow { margin-top: 4px; }
.ptl { padding: 4px 14px 0; }
.swipe { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; }
.sw { flex: 0 0 auto; width: 150px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.sw i { display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 12px; border: 1px solid var(--edge); font-style: normal; font-size: 12px; color: var(--muted); }
.sw b { font-size: 14px; font-weight: 700; }
.swatch { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--edge); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
.confirm { position: sticky; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.confirmed { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px; background: var(--ok); color: var(--ok-ink); font-weight: 600; }

.ph { position: relative; border-radius: 18px; overflow: hidden; background: linear-gradient(135deg, var(--ph-a), var(--ph-b)); color: var(--ph-ink); display: flex; align-items: flex-end; min-height: 170px; }
.ph.hero-ph { min-height: 180px; }
.ph .phimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph .tag { position: relative; z-index: 1; margin: 12px; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--surface); color: var(--ink); }
.ph .mark { position: absolute; left: 56%; top: 38%; width: 56px; height: 42px; border-radius: 12px; border: 3px solid var(--canary); box-shadow: 0 0 0 2px #0C1F01; }
.ph .back { position: absolute; left: 12px; top: 12px; width: 40px; height: 40px; border-radius: 999px; background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
.ph-sq { aspect-ratio: 1 / 1; max-width: 100%; min-height: 0; border-radius: 14px; align-items: center; justify-content: center; font-size: 20px; }
.photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.photos.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.photos img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 14px; display: block; max-width: 100%; }
.add { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 14px; border: 1.5px dashed var(--control); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; color: var(--ink); }
.add input, .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.filebtn { position: relative; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 16px; border-radius: 18px; background: var(--surface); border: 1.5px dashed var(--control); cursor: pointer; }
textarea, select { box-sizing: border-box; width: 100%; padding: 12px 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--control); border-radius: 16px; font: inherit; font-size: 16px; font-weight: 400; }
textarea { resize: vertical; min-height: 84px; }
.switch { flex: 0 0 auto; width: 52px; height: 32px; padding: 3px; border-radius: 999px; border: 0; display: flex; align-items: center; cursor: pointer; background: var(--control); justify-content: flex-start; }
.switch[aria-checked="true"] { background: var(--switch-on); justify-content: flex-end; }
.switch span { width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.switch[aria-checked="true"] span { background: var(--canary); }
.stepper { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--soft); }
.stepper button { width: 36px; height: 36px; border-radius: 999px; border: 0; background: var(--surface); font-size: 18px; cursor: pointer; color: var(--ink); }
.stepper button.plus { background: var(--ink); color: var(--page); }
.stepper b { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 14px 10px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.wday i { font-style: normal; width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; border: 1px solid var(--line); box-sizing: border-box; color: var(--muted); }
.wday.done i { background: var(--ok); color: var(--ok-ink); border-color: transparent; }
.wday.now i { background: var(--ink); color: var(--page); border-color: transparent; }
.timeline { padding: 8px 16px; }
.step { display: flex; gap: 14px; }
.rail { display: flex; flex-direction: column; align-items: center; width: 24px; }
.rail .tl, .rail .bl { width: 2px; background: var(--line); }
.rail .tl { height: 10px; }
.rail .bl { flex-grow: 1; margin-top: 2px; }
.rail .dotc { width: 24px; height: 24px; border-radius: 999px; box-sizing: border-box; border: 2px solid var(--control); background: var(--surface); display: flex; align-items: center; justify-content: center; }
.step.done .dotc { background: var(--ink); border-color: var(--ink); color: var(--canary); }
.step.done .tl, .step.done .bl, .step.now .tl { background: var(--ink); }
.step.now .dotc { border: 7px solid var(--ink); background: var(--canary); }
.step .txt { flex-grow: 1; display: flex; justify-content: space-between; gap: 8px; padding: 10px 0 14px; }
.step.later .txt { color: var(--muted); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 28px 20px; }
.empty .tile { width: 56px; height: 56px; border-radius: 18px; font-size: 26px; }

/* office */
.obar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.obar-in { max-width: 1120px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wordmark { display: flex; flex-direction: column; line-height: 1.05; }

.otp-boxes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.otp-box { height: 60px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--control); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.otp:focus-within .otp-box.on { box-shadow: inset 0 0 0 2px var(--brand); }
.otp.err .otp-box { box-shadow: inset 0 0 0 1.5px #E5484D; background: var(--stop); }
.otp.err .otp-boxes { animation: shake 0.32s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.autofill { align-self: center; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 24px; border-radius: 14px; border: 0; background: var(--seg); cursor: pointer; font: inherit; color: var(--ink); }
.autofill b { font-size: 17px; letter-spacing: 0.14em; }
.acctline { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.btn-danger { background: #C6282B; color: #FFFFFF; }
.btn-text.danger { color: #B42318; }
.demo-box { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; border: 1.5px dashed var(--control); }
@media (min-width: 900px) {
  .wrap.authwrap { max-width: 1040px; padding-block: 32px; }
  .login:not(.lcode) { display: grid; grid-template-columns: 1.05fr 1fr; gap: 32px; align-items: start; }
  .lhero { margin: 0; border-radius: 28px; padding: 40px; min-height: 640px; justify-content: space-between; position: sticky; top: 32px; }
  .lhero h1 { font-size: 50px; }
  .lcard { margin-top: 0; }
  .lcode { max-width: 440px; margin: 0 auto; }
}
/* ---------- motion ---------- */
:root { --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease-out: cubic-bezier(0.22, 1, 0.36, 1); --ios: cubic-bezier(0.32, 0.72, 0, 1); }
.view, .scrim, .sheet { animation: none; }
.hero { position: relative; overflow: hidden; isolation: isolate; }
.lhero { overflow: hidden; isolation: isolate; }
@media (max-width: 899px) { .lhero { position: relative; } }
.lhero .blob { position: absolute; border-radius: 999px; filter: blur(38px); z-index: -1; pointer-events: none; }
.lhero .b1 { width: 230px; height: 230px; background: #CBFF55; right: -70px; top: -50px; opacity: 0.30; }
.lhero .b2 { width: 190px; height: 190px; background: #4C8F1A; left: -60px; bottom: 0; opacity: 0.75; }
.lhero .b3 { width: 150px; height: 150px; background: #A6E36B; right: 28%; bottom: -50px; opacity: 0.26; }
.toast { transform: translate(-50%, 18px) scale(0.94); transition: opacity 0.2s ease, transform 0.5s var(--spring); }
.toast.show { transform: translate(-50%, 0) scale(1); }
.tabbar-in { position: relative; }
.tabbar a .ic { position: relative; z-index: 1; }
.tabind { position: absolute; left: 0; top: 0; width: 52px; height: 30px; border-radius: 999px; background: var(--ok); pointer-events: none; opacity: 0; transition: transform 0.5s var(--spring), opacity 0.2s ease; }
.tabbar-in.hasind a[aria-current="page"] .ic { background: transparent; }
.scrim.closing { pointer-events: none; }
.qa, .cardbtn, .seetile, .sw, .days button, .opt, .cchip, .notifybtn, .card.job, .nc .btn { transition: transform 0.2s var(--ease-out), box-shadow 0.2s ease; }
.qa:active, .cardbtn:active, .seetile:active, .sw:active, .days button:active, .opt:active, .cchip:active { transform: scale(0.96); }
.selrow:active { background: var(--soft); }
@media (hover: hover) {
  .qa:hover, .cardbtn:hover, .sw:hover, .card.job:hover { box-shadow: 0 2px 4px rgba(20,22,19,0.06), 0 14px 32px rgba(20,22,19,0.10); }
}
.tool.done .tname { text-decoration: none; background: linear-gradient(var(--muted), var(--muted)) no-repeat 0 58% / 100% 1.5px; }
.spin { width: 16px; height: 16px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #FFFFFF; display: inline-block; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.burst { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 80; pointer-events: none; }
.burst i { position: absolute; left: 0; top: 0; width: 8px; height: 10px; border-radius: 2px; background: var(--c); animation: confetti 0.95s var(--ease-out) forwards; }
@keyframes confetti { 0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  /* screens arrive in a quick stagger, sideways when you move between tabs */
  .wrap.enter .view > * { animation: inUp 0.55s var(--ease-out) both; }
  .wrap.enter.fromR .view > * { animation-name: inRight; }
  .wrap.enter.fromL .view > * { animation-name: inLeft; }
  .wrap.enter .view > :nth-child(2) { animation-delay: 40ms; }
  .wrap.enter .view > :nth-child(3) { animation-delay: 80ms; }
  .wrap.enter .view > :nth-child(4) { animation-delay: 120ms; }
  .wrap.enter .view > :nth-child(5) { animation-delay: 160ms; }
  .wrap.enter .view > :nth-child(6) { animation-delay: 200ms; }
  .wrap.enter .view > :nth-child(7) { animation-delay: 240ms; }
  .wrap.enter .view > :nth-child(8) { animation-delay: 280ms; }
  .wrap.enter .view > :nth-child(n+9) { animation-delay: 320ms; }
  @keyframes inUp { from { opacity: 0; transform: translateY(18px) scale(0.985); } to { opacity: 1; transform: none; } }
  @keyframes inRight { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes inLeft { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
  /* sign-in: drifting colour, then the content rises in */
  .lhero .b1 { animation: drift1 9s ease-in-out infinite alternate; }
  .lhero .b2 { animation: drift2 12s ease-in-out infinite alternate; }
  .lhero .b3 { animation: drift3 10s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(-100px, 80px) scale(1.18); } }
  @keyframes drift2 { to { transform: translate(120px, -70px) scale(0.88); } }
  @keyframes drift3 { to { transform: translate(-80px, -100px) scale(1.25); } }
  .wrap.enter .view.login > .lhero, .wrap.enter .view.login > .lside { animation: none; }
  .wrap.enter .lhero { animation: fadeIn 0.6s ease both; }
  .wrap.enter .lhero > :not(.blob), .wrap.enter .lside > * { animation: inUp 0.65s var(--ease-out) both; }
  .wrap.enter .lhero > :nth-child(5) { animation-delay: 80ms; }
  .wrap.enter .lhero > :nth-child(6) { animation-delay: 160ms; }
  .wrap.enter .lside > :nth-child(1) { animation-delay: 200ms; }
  .wrap.enter .lside > :nth-child(2) { animation-delay: 280ms; }
  .wrap.enter .lside > :nth-child(n+3) { animation-delay: 340ms; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  /* green cards catch the light once, bars fill, badges pop */
  .wrap.enter .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.16) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 1.4s var(--ease-out) 0.35s; pointer-events: none; z-index: 2; }
  @keyframes sheen { to { transform: translateX(120%); } }
  .wrap.enter .bar i { animation: grow 1.1s var(--ease-out) 0.3s both; transform-origin: left center; }
  @keyframes grow { from { transform: scaleX(0); } }
  .wrap.enter .nbadge, .wrap.enter .iconbtn .cnt { animation: badgeIn 0.5s var(--spring) 0.45s both; }
  @keyframes badgeIn { from { transform: scale(0); } }
  .iconbtn .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 999px; border: 2px solid #E5484D; opacity: 0; animation: ping 1.8s ease-out 0.6s 3; }
  @keyframes ping { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(1.9); opacity: 0; } }
  .nudge { display: inline-block; animation: nudge 1.4s ease-in-out 0.9s 3; }
  @keyframes nudge { 50% { transform: translateX(5px); } }
  .wrap.enter .confirm .btn-primary { animation: attn 2.2s ease-in-out 1.2s 2; }
  @keyframes attn { 0%, 100% { box-shadow: var(--shadow), 0 0 0 0 rgba(203,255,85,0); } 50% { box-shadow: var(--shadow), 0 0 0 9px rgba(203,255,85,0.5); } }
  /* sliding tab highlight with a little icon bounce */
  .tabbar a[aria-current="page"] .ic svg { animation: tabPop 0.45s var(--spring); }
  @keyframes tabPop { 0% { transform: scale(0.8); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
  /* bottom sheets spring up and slide away */
  .scrim.opening { animation: scrimIn 0.3s ease-out; }
  .scrim.opening .sheet { animation: sheetUp 0.5s var(--ios); }
  .scrim.closing { animation: scrimOut 0.26s ease-in forwards; }
  @keyframes scrimIn { from { background-color: transparent; } }
  @keyframes scrimOut { to { background-color: transparent; } }
  .scrim.closing .sheet { animation: sheetDown 0.26s ease-in forwards; }
  .scrim.swapping .sheet > * { animation: fadeIn 0.25s ease-out; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes sheetDown { to { transform: translateY(100%); } }
  @keyframes fadeOut { to { opacity: 0; } }
  /* one-off moments */
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.88); } 100% { opacity: 1; transform: none; } }
  .tool.pop .tile { animation: pop 0.42s var(--spring); }
  .tool.done.pop .tname { animation: strike 0.35s var(--ease-out) both; }
  @keyframes strike { from { background-size: 0 1.5px; } }
  .flash { animation: popIn 0.55s var(--spring) both; }
  .otp-box.pop { animation: pop 0.28s var(--spring); }
  .msg.newmsg { animation: msgIn 0.45s var(--spring) both; transform-origin: bottom left; }
  .msg.me.newmsg { transform-origin: bottom right; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(14px) scale(0.9); } }
}
/* ---------- round two: on-brand moments ---------- */
#splash { position: fixed; inset: 0; z-index: 100; background: var(--grad); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; color: #FFFFFF; cursor: pointer; }
#splash .sp-logo { width: 196px; height: auto; display: block; opacity: 0; animation: spLogo 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards; }
#splash .sp-track { position: relative; width: 220px; height: 46px; margin: 10px 0 14px; }
#splash .sp-stroke { position: absolute; inset: 0; border-radius: 6px 3px 3px 6px; background: linear-gradient(180deg, rgba(255,255,255,0.30) 0, rgba(255,255,255,0) 20%, rgba(0,0,0,0) 80%, rgba(60,90,0,0.18) 100%), repeating-linear-gradient(180deg, rgba(255,255,255,0.08) 0 1px, rgba(0,0,0,0) 1px 3px, rgba(110,150,20,0.10) 3px 4px, rgba(0,0,0,0) 4px 6px), #CBFF55; transform: scaleX(0); transform-origin: left center; animation: spPaint 0.8s cubic-bezier(0.45, 0, 0.2, 1) 0.3s forwards; box-shadow: 0 6px 18px rgba(203,255,85,0.3); }
#splash .sp-roller { position: absolute; left: -105.5px; top: -20px; width: 124px; height: 76px; overflow: visible; opacity: 0; animation: spRoll 0.8s cubic-bezier(0.45, 0, 0.2, 1) 0.3s forwards; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25)); }
#splash .sp-tag { font-size: 15px; font-weight: 500; color: #D3DEC6; opacity: 0; animation: spFade 0.45s ease 0.9s forwards; }
#splash.out { animation: splashOut 0.62s cubic-bezier(0.32, 0.72, 0, 1) forwards; pointer-events: none; }
@keyframes spLogo { from { opacity: 0; transform: translateY(12px) scale(0.94); } to { opacity: 1; transform: none; } }
@keyframes spPaint { to { transform: scaleX(1); } }
#splash .sp-nap { animation: spNap 0.2s linear 0.3s 4; }
@keyframes spNap { to { transform: translateX(-3px); } }
@keyframes spRoll { 0% { opacity: 1; transform: translateX(0) rotate(-2deg); } 100% { opacity: 1; transform: translateX(220px) rotate(1.5deg); } }
@keyframes spFade { to { opacity: 1; } }
@keyframes splashOut { to { transform: translateY(-100%); border-radius: 0 0 56px 56px; } }
.brush { position: relative; white-space: nowrap; }
.brush::after { content: ""; position: absolute; left: -1%; right: -3%; bottom: -0.1em; height: 0.16em; background: #CBFF55; border-radius: 4px 999px 999px 6px; transform-origin: left center; }
@media (prefers-reduced-motion: no-preference) {
  .wrap.enter .brush::after { animation: brushIn 0.7s cubic-bezier(0.45, 0, 0.2, 1) 0.75s both; }
  @keyframes brushIn { from { transform: scaleX(0); } }
  /* a slow lime glow drifts across the green cards */
  .hero::before { content: ""; position: absolute; inset: -40%; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side at 22% 30%, rgba(203,255,85,0.42), rgba(203,255,85,0) 100%) 0 0 / 48% 60% no-repeat,
                radial-gradient(closest-side at 50% 50%, rgba(86,190,70,0.55), rgba(86,190,70,0) 100%) 100% 20% / 55% 70% no-repeat,
                radial-gradient(closest-side at 50% 50%, rgba(166,227,107,0.38), rgba(166,227,107,0) 100%) 40% 100% / 50% 55% no-repeat;
    animation: glow 12s ease-in-out infinite alternate, glowTurn 26s linear infinite; will-change: transform; }
  .hero::-webkit-scrollbar { display: none; }
  @keyframes glow { from { transform: translate(-9%, -6%) scale(1); } to { transform: translate(9%, 7%) scale(1.18); } }
  @keyframes glowTurn { from { rotate: 0deg; } to { rotate: 360deg; } }
  /* colours get rolled on, tins fill up */
  .wrap.enter .sw i { animation: paintOn 0.75s cubic-bezier(0.45, 0, 0.2, 1) 0.5s both; }
  .wrap.enter .sw:nth-child(2) i { animation-delay: 0.62s; }
  .wrap.enter .sw:nth-child(3) i { animation-delay: 0.74s; }
  .wrap.enter .sw:nth-child(n+4) i { animation-delay: 0.86s; }
  .scrim.opening .bigswatch { animation: paintOn 0.75s cubic-bezier(0.45, 0, 0.2, 1) 0.3s both; }
  @keyframes paintOn { from { clip-path: inset(0 100% 0 0 round 12px); } to { clip-path: inset(0 0 0 0 round 12px); } }
  .tinfill, .tinlid { transform-box: fill-box; }
  .tinfill { transform-origin: center bottom; }
  .tinlid { transform-origin: center bottom; }
  .wrap.enter .sw .tinfill, .scrim.opening .tinfill { animation: tinFill 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both; }
  .scrim.opening .selhead .tinlid { animation: lidPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both; }
  @keyframes tinFill { from { transform: scaleY(0); } }
  @keyframes lidPop { 0% { transform: none; } 40% { transform: translateY(-12px) rotate(-8deg); } 100% { transform: none; } }
  /* the tick draws itself after "Got it" and "Send report" */
  .confirmed.flash .ck circle { stroke-dasharray: 100; animation: drawIn 0.5s ease-out 0.1s both; }
  .confirmed.flash .ck path { stroke-dasharray: 100; animation: drawIn 0.4s ease-out 0.5s both; }
  @keyframes drawIn { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  /* circles on site-note photos get drawn on */
  .wrap.enter .noteimg ellipse { stroke-dasharray: 100; animation: drawIn 0.9s cubic-bezier(0.45, 0, 0.2, 1) 0.55s both; }
  /* bell rings when there's something new, bucket tips when you go for it */
  .wrap.enter .iconbtn[aria-label$="new"] svg { animation: ring 0.9s ease 0.7s; transform-origin: 50% 15%; }
  @keyframes ring { 10%, 30%, 50% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-14deg); } 60%, 100% { transform: none; } }
  .qa.alert:hover .qe, .qa.alert:active .qe { animation: tip 0.55s ease; }
  @keyframes tip { 30% { transform: rotate(-16deg); } 65% { transform: rotate(9deg); } 100% { transform: none; } }
}
.ck { flex: 0 0 auto; display: block; }
/* ---------- tasks ---------- */
.ringwrap { position: relative; width: 60px; height: 60px; flex: 0 0 auto; display: inline-block; }
.ringwrap svg { width: 60px; height: 60px; transform: rotate(-90deg); display: block; }
.ring-bg { stroke: var(--soft); }
.ring-fg { stroke: var(--brand); stroke-dasharray: 100; stroke-linecap: round; transition: stroke-dashoffset 0.9s var(--ease-out); }
.ringwrap b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tasklink { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.task { overflow: hidden; }
.thead { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 12px; }
.tcheck { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 999px; border: 2px solid var(--control); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: transparent; padding: 0; transition: background 0.2s, border-color 0.2s, color 0.2s; }
.tcheck svg, .tbox svg, .mini svg { width: 15px; height: 15px; display: block; }
.task.done .tcheck { background: var(--brand); border-color: var(--brand); color: #FFFFFF; }
.ttitle { font-size: 16px; font-weight: 600; line-height: 1.3; }
.task.done .ttitle { color: var(--muted); }
.tmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); margin-top: 3px; }
.tmeta .late { color: var(--stop-ink); font-weight: 700; }
.tmeta .you { color: var(--ok-ink); font-weight: 700; }
.tprog { height: 5px; background: var(--soft); margin: 0 16px 4px; border-radius: 999px; overflow: hidden; }
.tprog i { display: block; height: 100%; background: var(--bar-fill); border-radius: 999px; transition: width 0.55s var(--ease-out); }
.titems { display: flex; flex-direction: column; padding: 4px 8px 8px; }
.titem { position: relative; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 6px 8px; border-radius: 12px; cursor: pointer; font-size: 15px; }
.titem:active { background: var(--soft); }
.titem input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.tbox { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--control); display: inline-flex; align-items: center; justify-content: center; color: transparent; transition: background 0.18s, box-shadow 0.18s, color 0.18s; }
.titem.on .tbox { background: var(--brand); box-shadow: none; color: var(--canary); }
.titem.on .tlabel { color: var(--muted); background: linear-gradient(var(--muted), var(--muted)) no-repeat 0 58% / 100% 1.5px; }
.titem input:focus-visible + .tbox { outline: 2px solid var(--focus); outline-offset: 2px; }
.tphotorow { display: flex; align-items: center; gap: 8px; margin: 0 16px 14px; }
.tphoto { position: relative; flex: 1 1 auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--warn); color: var(--warn-ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.tphoto.ok { background: var(--ok); color: var(--ok-ink); cursor: default; }
.tphoto input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.tphoto img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; display: block; }
.tsum { display: block; width: 100%; border: 0; background: transparent; text-align: left; font: inherit; color: var(--link); font-weight: 600; font-size: 13px; padding: 0 16px 14px 58px; cursor: pointer; }
.trow { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-width: 0; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; font: inherit; color: inherit; }
button.trow { cursor: pointer; }
.trow:last-child { border-bottom: 0; }
.mini { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--control); display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.trow.done .mini { background: var(--brand); box-shadow: none; color: #FFFFFF; }
.trow .tt { font-weight: 600; overflow-wrap: anywhere; }
.trow > .col.grow { min-width: 0; }
.trow > .btn { flex: 0 0 auto; }
.trow.done .tt { color: var(--muted); text-decoration: line-through; }
.onav { display: flex; gap: 4px; padding: 4px; background: var(--seg); border-radius: 999px; }
.onav a { padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.onav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.tgroups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 14px; align-items: start; }
.tgroup-head { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.tmpl { gap: 10px; }
.clockcard { padding: 14px 16px; gap: 12px; }
.seg button { white-space: nowrap; }
.segn { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 5px; border-radius: 999px; background: var(--control); color: var(--ink); font-size: 11px; font-weight: 700; }
.seg button[aria-pressed="true"] .segn { background: var(--brand); color: #FFFFFF; }
@media (prefers-reduced-motion: no-preference) {
  .titem.pop .tbox { animation: pop 0.35s var(--spring); }
  .titem.pop .tbox path { stroke-dasharray: 100; animation: drawIn 0.3s ease-out both; }
  .titem.on.pop .tlabel { animation: strike 0.35s var(--ease-out) both; }
  .task.justdone { animation: popIn 0.55s var(--spring) both; }
  .task.justdone .tcheck, .trow.justdone .mini { animation: pop 0.5s var(--spring); }
  .wrap.enter .tprog i { animation: grow 1s var(--ease-out) 0.3s both; transform-origin: left center; }
  .flashrow { animation: rowIn 0.7s var(--ease-out) both; }

.telltile { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 14px; min-height: 116px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; cursor: pointer; transition: transform 0.2s var(--ease-out), box-shadow 0.2s ease; }
.telltile:hover { box-shadow: var(--shadow); }

    if (c === "cfile") {

      files.forEach((f) => {
        const item = { name: f.name, kind: /^image\//.test(f.type) ? "photo" : "doc", img: null, at: "today " + nowTime() };

        else if (--left === 0) done();
      });
      el.value = ""; return;

  });
  document.addEventListener("input", (e) => {

    sp.innerHTML = '<img class="sp-logo" src="' + IMG.logoRev + '" alt=""><div class="sp-track"><span class="sp-stroke"></span>' + roller + '</div><span class="sp-tag">Every job, one app.</span>';
